name: mobile
description: "NEVA MOBILE — Android sürümü (Flutter). Masaüstü (Tauri/Rust) sürümüyle aynı SQLite şeması ve lisans algoritmasını paylaşır."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Veritabanı
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Lisans (Ed25519 doğrulama + cihaz kimliği)
  ed25519_edwards: ^0.3.1
  crypto: ^3.0.3
  # NOT: "android_id" paketi (jni bağımlılığı üzerinden) mevcut Gradle/Kotlin DSL
  # kurulumuyla derleme hatası veriyordu. Settings.Secure.ANDROID_ID okumak tek
  # satırlık bir Android API çağrısı olduğu için üçüncü parti paket yerine
  # MainActivity.kt içinde kendi MethodChannel'ımız kullanılıyor (bkz. device_id.dart).

  # Format
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

  # Faz 2 (tam ozellik parite: grafikler, PDF, paylasim, yedekleme/geri yukleme)
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  share_plus: ^10.1.2
  http: ^1.2.2
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  # file_picker 8.x kendi android/build.gradle'inda compileSdk=34 sabitliyordu
  # (transitive flutter_plugin_android_lifecycle >=36 istiyor -> derleme hatasi).
  # 11.x ise "Built-in Kotlin" gerektiriyor, bu Flutter surumunde desteklenmiyor
  # (GeneratedPluginRegistrant sinif bulamama hatasi). 10.x bandi ikisini de
  # asiyor: compileSdk duzeltilmis + eski KGP modeliyle uyumlu. Ust siniri
  # <11.0.0 olarak sabit tutuluyor, patch guncellemeleri serbest.
  file_picker: ">=10.1.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_android'in guncel surumleri "jni" paketini kullaniyor; o paketin
# Gradle build.gradle'i mevcut Kotlin Gradle Plugin surumuyle uyumsuz olup
# "Could not find method kotlin()" hatasi veriyor (bilinen ekosistem sorunu).
# jni-oncesi kararli surume sabitlenerek Android derlemesi calisir hale getirildi.
dependency_overrides:
  path_provider_android: 2.2.10

flutter:
  uses-material-design: true
  assets:
    - assets/migrations/
